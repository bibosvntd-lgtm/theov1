<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theo's Projekte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Theo's Projekte"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D2202E">
<script src="local.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, präzise, werkstattnah – tägliche Geschäftsarbeit
   IDEA: verchromtes Werkzeugbrett – schwarze Leiste, Glasflächen über roten und graphitfarbenen Formen
   PICTURE: das Status-Tortendiagramm und die Kennzahlen; auf der Anmeldung schwebende Glaskarten
   COLOUR and TYPE: Snap-on-Rot #D2202E, Schwarz, Weiß, Chromgrau; Barlow (Titel, Zahlen) + Inter (Text)
   LAYOUT: schwarze Symbolleiste, transparente Navigation, großzügige Karten; unter 760px Tab-Leiste */
:root{color-scheme:light;
  --fs:1;--acc:210,32,46;--red:#D2202E;--red-d:#A9141F;--red-dd:#8E0E18;--red-t:rgba(var(--acc),.11);
  --ink:#111214;--ink2:#4F545C;--ink3:#6B7079;--line:rgba(17,18,20,.09);
  --glass:linear-gradient(140deg,rgba(255,255,255,.66),rgba(255,255,255,.38));
  --glass-edge:rgba(255,255,255,.78);
  --shadow:0 12px 32px rgba(18,20,26,.09),0 2px 6px rgba(18,20,26,.05);
  --blur:blur(18px) saturate(160%);
  --r:20px;--r-s:14px;
  --fh:"Barlow","Helvetica Neue",Arial,sans-serif;
  --fb:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --vvh:100dvh;--vvt:0px;
}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:24px}
body{margin:0;color:var(--ink);font:calc(16px*var(--fs))/1.5 var(--fb);background:#ECEEF1;overflow-x:clip;-webkit-tap-highlight-color:transparent;min-height:100dvh}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.08;letter-spacing:-.01em}
h1{font-size:calc(clamp(32px,4vw,44px)*var(--fs));font-weight:700;text-wrap:balance}
h2{font-size:calc(22px*var(--fs));font-weight:700}
h3{font-size:calc(18px*var(--fs));font-weight:600}
p{margin:0}
a{color:var(--red-d)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid rgba(var(--acc),.55);outline-offset:2px;border-radius:10px}

/* Hintergrund: ruhige Formen, die durch das Glas scheinen */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
  linear-gradient(115deg,#F7F8FA 0%,#E7E9ED 38%,#F5F6F8 55%,#DADDE2 100%)}
.bg i{position:absolute;border-radius:50%;display:block}
.bg .b1{width:62vmax;height:62vmax;right:-22vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(var(--acc),.42),rgba(var(--acc),.12) 60%,transparent)}
.bg .b2{width:58vmax;height:58vmax;left:-24vmax;bottom:-30vmax;background:radial-gradient(closest-side,rgba(20,21,24,.30),rgba(20,21,24,.08) 62%,transparent)}
.bg .b3{width:34vmax;height:34vmax;left:38%;top:44%;background:radial-gradient(closest-side,rgba(var(--acc),.16),transparent)}
.bg .sheen{position:absolute;inset:-20%;border-radius:0;background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,255,255,.35) 120px 122px,transparent 122px 260px)}

.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:var(--r);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
@media (prefers-reduced-transparency:reduce){
  .glass,.side,.tabbar,dialog,.inp,.chip,.kpi{background:#FAFAFB!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .bg i,.bg .sheen{display:none}
}

/* Schaltflächen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:calc(16px*var(--fs));cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(var(--acc),.28),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{background:var(--red-d)}
.btn.dark{background:#141517;color:#fff}
.btn.ghost{background:rgba(255,255,255,.55);border-color:rgba(17,18,20,.16);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.85)}
.btn.danger{background:rgba(255,255,255,.55);border-color:rgba(169,20,31,.35);color:var(--red-dd)}
.btn.danger-solid{background:var(--red-dd);color:#fff}
.btn.soft{background:var(--red-t);color:var(--red-d)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 14px;font-size:calc(15px*var(--fs))}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:0;background:transparent;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:rgba(17,18,20,.06)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Anmeldung ---------- */
#login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;padding:max(24px,env(safe-area-inset-top)) max(5vw,20px) max(24px,env(safe-area-inset-bottom));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;font-family:var(--fh);font-weight:700;font-size:calc(24px*var(--fs))}
.mono{width:48px;height:48px;border-radius:14px;background:#111214;color:#fff;display:grid;place-items:center;font:700 20px var(--fh);letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(0,0,0,.2);position:relative}
.mono::after{content:"";position:absolute;left:10px;right:10px;bottom:8px;height:3px;border-radius:2px;background:var(--red)}
.brand .sep{width:1px;height:30px;background:rgba(17,18,20,.25)}
.hero h1{font-size:calc(clamp(40px,4.6vw,60px)*var(--fs));margin:38px 0 10px}
.hero .lead{font-size:calc(19px*var(--fs));color:var(--ink2)}
.scene{position:relative;margin-top:42px;height:300px;max-width:560px}
.scene .glass{position:absolute;padding:16px 18px}
.sc1{left:0;top:10px;width:230px}.sc2{left:0;top:160px;width:230px}.sc3{left:270px;top:60px;width:270px}
.sk{height:9px;border-radius:5px;background:rgba(17,18,20,.12);margin-top:10px}
.mini{display:flex;align-items:center;gap:10px;font-weight:600}
.mini .av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--red-t);color:var(--red-d)}
.mini small{display:block;font-weight:500;color:var(--ink3);font-size:calc(13px*var(--fs))}
.scene svg.link{position:absolute;left:228px;top:56px;width:46px;height:170px;overflow:visible}
.login-card{padding:clamp(26px,4vw,44px);position:relative;overflow:hidden}
.login-card h2{font-size:calc(clamp(32px,3.6vw,42px)*var(--fs))}
.login-card .sub{color:var(--ink2);margin:8px 0 28px;font-size:calc(17px*var(--fs))}
.acct{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid rgba(17,18,20,.1);margin-bottom:18px}
.acct .av{width:46px;height:46px;border-radius:50%;background:#141517;color:#fff;display:grid;place-items:center;font:700 17px var(--fh);flex:none}
.acct b{display:block;font-weight:600}
.acct span{color:var(--ink2);font-size:calc(14px*var(--fs));overflow-wrap:anywhere}
.login-card .btn.primary{width:100%;min-height:56px;font-size:calc(18px*var(--fs));border-radius:16px}
.linkbtn{background:none;border:0;padding:10px 0;color:var(--red-d);font-weight:600;cursor:pointer;min-height:44px}
.row-end{display:flex;justify-content:flex-end}
.secure{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--ink2);font-size:calc(14px*var(--fs));margin-top:22px;text-align:center}
.state{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid rgba(17,18,20,.1);color:var(--ink2);margin-bottom:18px}
.state.err{border-color:rgba(169,20,31,.3);color:var(--red-dd);background:rgba(255,240,241,.75)}
@media (max-width:900px){#login{grid-template-columns:1fr;align-content:start}.scene{display:none}.hero h1{margin:26px 0 6px}}

/* ---------- App-Rahmen ---------- */
#app{display:grid;grid-template-columns:72px 236px minmax(0,1fr);gap:14px;padding:14px max(14px,env(safe-area-inset-right)) 14px max(14px,env(safe-area-inset-left));min-height:100dvh}
.rail{position:sticky;top:14px;height:calc(100dvh - 28px);background:linear-gradient(180deg,#17181B,#0B0C0D);border-radius:22px;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px;box-shadow:0 14px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.rail .mono{width:44px;height:44px;margin-bottom:18px;background:#000;border:1px solid rgba(255,255,255,.22)}
.rail button{width:48px;min-height:48px;border-radius:14px;border:0;background:transparent;color:#C9CCD1;display:grid;place-items:center;cursor:pointer;gap:2px;padding:6px 0}
.rail button:hover{background:rgba(255,255,255,.08);color:#fff}
.rail button[aria-current=page]{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(var(--acc),.45)}
.rail button .ic{width:22px;height:22px}
.rail .lbl{display:none;font-size:calc(11px*var(--fs));font-weight:600;line-height:1.1}
.rail .push{margin-top:auto}
.side{position:sticky;top:14px;height:calc(100dvh - 28px);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.side .title{font:700 22px/1.1 var(--fh);padding:0 10px 18px}
.side button{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border-radius:14px;border:0;background:transparent;font-size:calc(16px*var(--fs));font-weight:500;cursor:pointer;text-align:left;color:var(--ink)}
.side button:hover{background:rgba(255,255,255,.55)}
.side button[aria-current=page]{background:var(--red-t);color:var(--red-d);font-weight:600}
.side .push{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.side .who{font-size:calc(13px*var(--fs));color:var(--ink3);padding:4px 14px 10px;overflow-wrap:anywhere}
.tabbar{display:none}
main{container-type:inline-size;padding:clamp(10px,2vw,26px) clamp(4px,1.6vw,22px) 40px;max-width:1260px;width:100%}

@media (max-width:1099px){
  #app{grid-template-columns:84px minmax(0,1fr)}
  .side{display:none}
  .rail button{width:66px}
  .rail .lbl{display:block}
}
@media (max-width:760px){
  #app{display:block;padding:0}
  .rail{display:none}
  main{padding:max(16px,env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;padding:6px;border-radius:22px;background:rgba(18,19,21,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .tabbar button{min-height:56px;border:0;border-radius:16px;background:transparent;color:#C9CCD1;display:grid;place-items:center;gap:2px;font-size:calc(12px*var(--fs));font-weight:600;cursor:pointer;padding:6px 0}
  .tabbar button[aria-current=page]{background:var(--red);color:#fff}
}

/* ---------- Seitenkopf ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 18px;margin-bottom:22px}
.ph .sub{color:var(--ink2);font-size:calc(17px*var(--fs));margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--ink2);margin-bottom:14px;font-size:calc(15px*var(--fs));flex-wrap:wrap}
.crumb a{color:var(--red-d);font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.card{padding:clamp(16px,2vw,24px)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{display:flex;align-items:center;gap:10px}
.muted{color:var(--ink2)}
.small{font-size:calc(14px*var(--fs))}
.banner{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;margin-bottom:16px;background:rgba(255,246,247,.85);border:1px solid rgba(169,20,31,.25);color:var(--red-dd);font-weight:500}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;min-height:128px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.kpi .ki{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(17,18,20,.06)}
.kpi .kl{font-weight:600;font-size:calc(15px*var(--fs));color:var(--ink2)}
.kpi .kv{font:700 clamp(32px,4cqi,42px)/1 var(--fh);font-variant-numeric:tabular-nums}
.kpi:hover{background:linear-gradient(140deg,rgba(255,255,255,.85),rgba(255,255,255,.55))}
.kpi.warn{background:linear-gradient(140deg,rgba(255,236,238,.8),rgba(255,214,218,.5));border-color:rgba(255,255,255,.8)}
.kpi.warn .ki{background:var(--red-dd);color:#fff}
.kpi.warn .kv,.kpi.warn .kl{color:var(--red-dd)}
.kpi.ok .ki{background:#141517;color:#fff}
.kpi.act .ki{background:var(--red);color:#fff}
@container (max-width:760px){.kpi{padding:14px 12px;min-height:118px}.kpi .kl{font-size:calc(14px*var(--fs))}}
@container (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.chart-wrap{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:center}
@container (max-width:760px){.chart-wrap{grid-template-columns:1fr}.pie{max-width:280px;margin:0 auto}}
.pie{width:100%;aspect-ratio:1;display:block;overflow:visible}
.pie path,.pie circle{cursor:pointer;transition:transform .22s ease,opacity .2s;outline:none}
.pie .dim{opacity:.45}
.pie path:focus-visible,.pie circle:focus-visible{stroke:#111;stroke-width:3}
.pie text{font:600 15px var(--fh);pointer-events:none}
.legend{display:flex;flex-direction:column}
.lg{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em 5em;align-items:center;gap:12px;min-height:54px;padding:4px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;border-radius:12px;font-size:calc(16px*var(--fs))}
.lg:last-child{border-bottom:0}
.lg[aria-pressed=true]{background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(17,18,20,.1)}
.lg .nm{display:flex;align-items:center;gap:8px;font-weight:500}
.lg .n,.lg .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.sw{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw .ic{width:14px;height:14px}
.sel-panel{margin-top:14px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid rgba(17,18,20,.1);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.sel-panel b{font:700 20px var(--fh)}
.foot-note{font-size:calc(13px*var(--fs));color:var(--ink3);margin-top:10px}
.dash-low{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;margin-top:16px}
@container (max-width:760px){.dash-low{grid-template-columns:1fr}}
.alert-card{background:linear-gradient(140deg,rgba(255,238,240,.82),rgba(255,216,220,.5))}
.alert-card h2{color:var(--red-dd)}
.big-od{display:flex;align-items:baseline;gap:10px;color:var(--red-dd);font-family:var(--fh);margin:4px 0 10px}
.big-od b{font-size:calc(56px*var(--fs));line-height:1}
.big-od span{font-size:calc(22px*var(--fs));font-weight:600}

/* Listenzeilen */
.rows{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 24px;gap:12px;align-items:center;padding:10px 12px;min-height:64px;border-radius:16px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);text-decoration:none;color:inherit;cursor:pointer}
.lrow:hover{background:rgba(255,255,255,.8)}
.lrow .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(17,18,20,.08)}
.lrow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .meta{display:block;font-size:calc(14px*var(--fs));color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .dt{text-align:right;font-size:calc(15px*var(--fs));white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow .dt small{display:block;color:var(--ink3);font-size:calc(12px*var(--fs))}
.lrow.cp{grid-template-columns:44px minmax(0,1fr) 24px}
.lrow.od{background:rgba(255,236,238,.72);border-color:rgba(var(--acc),.25)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:30px 16px}
.empty .eico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(17,18,20,.08)}
.empty .eico .ic{width:30px;height:30px}
.empty p{max-width:420px;color:var(--ink2)}

/* Status-Chips */
.st{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:calc(14px*var(--fs));font-weight:600;white-space:nowrap}
.st .ic{width:16px;height:16px}
.st-geplant{background:rgba(242,167,173,.38);color:#7A1621}
.st-aktiv{background:rgba(var(--acc),.13);color:#A3121E}
.st-pausiert{background:rgba(30,31,34,.10);color:#1E1F22}
.st-fertig{background:rgba(150,156,164,.24);color:#3B4047}
.od-badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:var(--red-dd);color:#fff;font-size:calc(13px*var(--fs));font-weight:600;white-space:nowrap}
.od-badge .ic{width:15px;height:15px}

/* ---------- Kunden ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);font-weight:600;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip[aria-pressed=true]{background:var(--red-t);color:var(--red-d);border-color:rgba(var(--acc),.2)}
.search{position:relative;flex:1 1 260px;max-width:440px;margin-left:auto}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);z-index:2}
.inp{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid rgba(17,18,20,.14);background:rgba(255,255,255,.62);font-size:calc(16px*var(--fs));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.search .inp{padding-left:44px}
.inp:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(var(--acc),.18);background:rgba(255,255,255,.9)}

/* ================= Glas-Design ================= */
:root{--glass:linear-gradient(145deg,rgba(255,255,255,.50),rgba(255,255,255,.20));--glass-edge:rgba(255,255,255,.72);
  --blur:blur(22px) saturate(185%);--shadow:0 20px 44px rgba(20,22,28,.13),0 2px 8px rgba(20,22,28,.06);--ink3:#5C6169}
body{background:#E4E6EA}
.bg{background:radial-gradient(130% 90% at 8% 0%,#FAFAFB 0%,#ECEEF1 40%,#DDE0E5 100%)}
.bg i{position:absolute;display:block;border-radius:50%}
.bg .b1{width:70vmax;height:70vmax;right:-24vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(var(--acc),.62),rgba(var(--acc),.22) 55%,transparent)}
.bg .b2{width:64vmax;height:64vmax;left:-26vmax;bottom:-32vmax;background:radial-gradient(closest-side,rgba(18,19,22,.48),rgba(18,19,22,.12) 60%,transparent)}
.bg .b3{width:40vmax;height:40vmax;left:34%;top:48%;background:radial-gradient(closest-side,rgba(var(--acc),.34),rgba(var(--acc),.08) 60%,transparent)}
.bg .b4{width:50vmax;height:50vmax;left:-10vmax;top:-18vmax;background:radial-gradient(closest-side,rgba(255,255,255,.95),transparent)}
.bg .b5{width:15vmax;height:15vmax;left:9vmax;top:62%;background:linear-gradient(140deg,var(--red-l,#E8414E),var(--red-d));opacity:.55}
.bg .ring{background:none}
.bg .r1{width:46vmax;height:46vmax;right:6vmax;top:30%;border:3.2vmax solid rgba(var(--acc),.20)}
.bg .r2{width:30vmax;height:30vmax;right:-8vmax;bottom:-6vmax;border:2.4vmax solid rgba(17,18,20,.16)}
.bg .bar1{border-radius:4vmax!important;width:60vmax;height:9vmax;left:30%;top:16%;transform:rotate(-14deg);background:linear-gradient(90deg,rgba(17,18,20,.0),rgba(17,18,20,.14),rgba(17,18,20,0))}
.bg .sheen{inset:-20%;border-radius:0!important;background:repeating-linear-gradient(115deg,transparent 0 140px,rgba(255,255,255,.28) 140px 142px,transparent 142px 300px)}

.glass{isolation:isolate;background:var(--glass);border:1px solid var(--glass-edge);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.14);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(125deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.16) 20%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 76%,rgba(255,255,255,.18) 100%)}
.card,.kpi,.ccard,.plist,.empty.glass{position:relative}

.kpi.act{background:linear-gradient(145deg,rgba(255,232,235,.62),rgba(255,210,215,.28))}

dialog{background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(246,247,249,.74))}

/* ---------- Verbindung & Anmeldung ---------- */
(async()=>{
  const C=window.claude;
  if(!C||typeof C.use!=='function'){S.boot='nodb';renderLogin();return}
  const killer=setTimeout(()=>{if(S.boot==='connecting'){S.boot='nodb';renderLogin()}},12000);
  try{
    const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
    S.db=db;S.user=user;
    C.use('assets').then(a=>{S.assets=a;if(S.authed)render()},()=>{});
    C.use('downloads').then(d=>{S.dl=d},()=>{});
    if(user){S.uid=await user.id();try{S.me=await user.me()}catch(e){S.me=null}}
  }catch(e){}
  clearTimeout(killer);
  S.boot=(S.db&&S.uid)?'ready':'nodb';
  renderLogin();
  if(S.boot==='ready')enter(false);
})();

function renderLogin(){
  const st=$('#lg-state'),b=$('#lg-btn');

    st.innerHTML=`<div class="state err">${ic('alert')}<div><b>Keine Verbindung zum Konto.</b><br>Öffne die App über claude.ai und melde dich dort an. Ohne Anmeldung sind Kunden- und Projektdaten nicht zugänglich.</div></div>`;
    b.disabled=true;b.innerHTML=`${ic('lock')} Anmeldung nicht möglich`;return;

function subscribe(){
  const base=S.db.doc('data/users/'+S.uid+'/kp');
  S.cCol=base.collection('customers');S.pCol=base.collection('projects');S.hCol=base.collection('hubs');S.sCol=base.collection('settings');mirInit();
  S.unsub.push(S.sCol.onSnapshot(snap=>{const d=snap.docs.find(x=>x.id==='main'&&x.exists);if(d){const v=d.data()||{},n={...SET_DEF};for(const k of Object.keys(SET_DEF))if(typeof v[k]==='string')n[k]=v[k];S.set=n;try{localStorage.setItem('kp-set',JSON.stringify(n))}catch(e){}applySet(n)}},()=>{}));
  S.slow=false;clearTimeout(S.slowTimer);

  const onErr=k=>e=>{S.loaded[k]=true;S.confirmed[k]=true;clearTimeout(S.slowTimer);S.slow=false;S.dbError=e;render();toast('Daten konnten nicht geladen werden. '+dbMsg(e),true)};
  const done=(k,snap)=>{mirrorSoon();S.loaded[k]=true;if(!snap.metadata.fromCache){S.confirmed[k]=true;if(S.confirmed.c&&S.confirmed.p){clearTimeout(S.slowTimer);S.slow=false}}render()};
  S.unsub.push(S.cCol.onSnapshot(snap=>{const ds=snap.docs.filter(d=>d.exists);S.rawC=Object.fromEntries(ds.map(d=>[d.id,d.data()]));S.customers=ds.map(normC);done('c',snap)},onErr('c')));

}

function dbMsg(e){
  switch(e&&e.code){
    case 'quota_exceeded':return 'Der Speicherplatz ist voll. Bitte lösche nicht mehr benötigte Einträge.';
    case 'invalid_argument':return 'Keine Schreibberechtigung oder ungültige Daten.';
    case 'revoked':return 'Der Zugriff wurde beendet. Bitte melde dich erneut an.';
    case 'resource_exhausted':return 'Zu viele Anfragen in kurzer Zeit. Bitte kurz warten.';
    default:return 'Verbindung fehlgeschlagen. Bitte erneut versuchen.';
  }
}
async function write(fn){
  try{return await fn()}catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,500+Math.random()*700));return await fn()}
    throw e;
  }
}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('kunde-'))return{v:'customer',id:h.slice(6)};
  if(h.startsWith('projekt-'))return{v:'project',id:h.slice(8)};
  if(h==='kunden')return{v:'customers'};
  if(h==='projekte')return{v:'projects'};
  if(h==='sicherung')return{v:'backup'};
  if(h==='start')return{v:'start'};
  if(h==='flexhub')return{v:'flexhub'};
  return{v:'dashboard'};
}

  if(!S.authed){$('#app').hidden=true;$('#login').hidden=false;renderLogin();return}

  const m=$('#main'),a=document.activeElement;
  const fid=a&&a.id&&m.contains(a)?a.id:null;let sel=null;
  if(fid){try{sel=[a.selectionStart,a.selectionEnd]}catch(e){}}
  let html=S.slow?`<div class="banner" role="status">${ic('alert')} Die Daten sind gerade nicht erreichbar. Angezeigte Werte sind möglicherweise nicht aktuell.</div>`:'';

  else html+=({dashboard:vDash,customers:vCustomers,customer:vCustomer,projects:vProjects,project:vProject,backup:vBackup})[r.v](r.id);
  m.innerHTML=html;
  const titles={dashboard:'Dashboard',customers:'Kunden',projects:'Projekte',backup:'Datensicherung',start:'Startmenü',flexhub:'ATC FlexHub'};
  document.title=(titles[r.v]||($('#main h1')?.textContent)||"Theo's Projekte")+" · Theo's Projekte";

function overallBlock(ps){

  const l=[...ps].sort((a,b)=>(a.created-b.created)||a.id.localeCompare(b.id));
  const main=l.slice(0,PCOL.length),rest=l.slice(PCOL.length);
  const items=main.map(p=>({k:p.id,p,c:col[p.id],d:doneCount(p),n:taskTotal(p),l:p.name,nr:p.number}));
  if(rest.length)items.push({k:'_rest',c:POTHER,d:rest.reduce((a,p)=>a+doneCount(p),0),n:sumTotal(rest),l:`Weitere Projekte (${rest.length})`,nr:''});

  const parts=[...items.filter(x=>x.d>0).map(x=>({...x,v:x.d})),{k:'_open',c:'#D5D9DE',v:T-done,l:'Offen'}].filter(x=>x.v>0);
  for(const x of parts){const a1=a0+x.v/T*2*Math.PI;const dim=sel&&x.k!==sel.k&&x.k!=='_open'?'dim':'';

function pieBlock(t,cnt,cfg){
  const cats=cfg.cats,sel=cfg.sel&&cnt[cfg.sel]>0?cfg.sel:null,A=cfg.act;
  const cx=130,cy=130,R=116,live=cats.filter(s=>cnt[s.k]>0);
  let a0=-Math.PI/2,shapes='',labels='';
  for(const s of live){
    const frac=cnt[s.k]/t,a1=a0+frac*2*Math.PI,mid=(a0+a1)/2,p=pctOf(cnt[s.k],t);
    const off=sel===s.k?10:0,tr=`translate(${(Math.cos(mid)*off).toFixed(2)} ${(Math.sin(mid)*off).toFixed(2)})`;
    const attr=`tabindex="0" role="button" data-act="${A}" data-k="${s.k}" aria-pressed="${sel===s.k}" aria-label="${s.l}: ${plural(cnt[s.k],...(cfg.unit||['Projekt','Projekte']))}, ${pctTxt(p)}" fill="${s.c}" stroke="#fff" stroke-width="2" transform="${tr}" class="${sel&&sel!==s.k?'dim':''}"`;
    if(live.length===1)shapes+=`<circle cx="${cx}" cy="${cy}" r="${R}" ${attr}/>`;
    else{const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
      shapes+=`<path d="M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" ${attr}/>`}
    if(frac>=.07){const lr=live.length===1?0:R*.6,lx=cx+lr*Math.cos(mid)+Math.cos(mid)*off,ly=cy+lr*Math.sin(mid)+Math.sin(mid)*off;
      labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="${s.t}">${pctTxt(p)}</text>`}
    a0=a1;
  }
  const s=sel&&cats.find(x=>x.k===sel);
  return `<div class="chart-wrap ${cfg.stack?'stack':''}"><svg class="pie" viewBox="0 0 260 260" aria-label="Tortendiagramm ${cfg.name}">${shapes}${labels}</svg>
  <div><div class="legend" role="group" aria-label="Legende ${cfg.name}">${cats.map(x=>`<button class="lg" data-act="${A}" data-k="${x.k}" aria-pressed="${sel===x.k}" ${cnt[x.k]?'':'disabled style="opacity:.55;cursor:default"'}>${swatch(x)}<span class="nm">${x.l}</span><span class="n">${nf0.format(cnt[x.k])}</span><span class="p">${pctTxt(pctOf(cnt[x.k],t))}</span></button>`).join('')}</div>
   <div class="sel-panel" aria-live="polite">${s?`<div>${swatch(s)} <span class="muted">${s.l}</span><br><b>${plural(cnt[s.k],...(cfg.unit||['Projekt','Projekte']))} · ${pctTxt(pctOf(cnt[s.k],t))}</b></div>${cfg.open?`<button class="btn primary sm" data-act="${cfg.open}" data-k="${s.k}">Projekte anzeigen ${ic('right')}</button>`:''}`
     :`<span class="muted">${ic('info')} Tippe auf ein Segment oder eine Zeile der Legende, ${cfg.open?'um die Werte zu sehen und die Projektliste zu öffnen.':'um die Werte zu sehen.'}</span>`}</div>
   <p class="foot-note">Prozentwerte auf eine Nachkommastelle gerundet; die Summe kann daher um 0,1&nbsp;% von 100&nbsp;% abweichen.</p></div></div>`;
}

function filteredProjects(){

  let l=S.projects.filter(p=>{
    if(q&&!projMatch(p,q))return false;
    if(f.customer&&p.customerId!==f.customer)return false;
    if(f.status&&p.status!==f.status)return false;
    if(f.phase&&phaseOf(p)!==f.phase)return false;
    if(f.due==='overdue'&&!isOD(p))return false;
    if(f.due==='upcoming'&&!(p.status!=='fertig'&&p.due>=S.today))return false;
    if(f.due==='week'&&!(p.status!=='fertig'&&p.due>=S.today&&p.due<=wk))return false;
    if(f.due==='month'&&!(p.status!=='fertig'&&p.due>=S.today&&p.due<=mo))return false;
    return true});
  const d=f.dir==='asc'?1:-1,key=f.sort;
  l.sort((a,b)=>{let r=key==='name'||key==='number'?coll.compare(a[key],b[key]):(a[key]||'9999').localeCompare(b[key]||'9999');return (r||coll.compare(a.name,b.name))*d});
  return l;
}

  if(!dj)throw new Error('In diesem Ordner liegt keine daten.json. Bitte den Speicherordner von „Theo\'s Projekte“ wählen.');
  const prefix=dj.p.slice(0,dj.p.length-'daten.json'.length),byPath=new Map(fl.map(x=>[x.p,x.f]));
  const bk=await readBackup(new File([await dj.f.text()],'daten.json')),m=new Map();
  for(const f of bk.files){const x=byPath.get(prefix+f.path);if(x){try{m.set(f.path,new Uint8Array(await x.arrayBuffer()))}catch(e){}}}

async function addFoamFiles(pid,files){

    }
  }catch(e){if(box.isConnected)box.innerHTML=`<div class="empty"><span class="eico">${ic('pdf')}</span><h3>Vorschau nicht möglich</h3><p>Die PDF-Datei konnte hier nicht angezeigt werden. Du kannst sie trotzdem herunterladen.</p></div>`}

async function shrinkImage(file){
  const url=URL.createObjectURL(file);

    const W=img.naturalWidth,H=img.naturalHeight;if(!W||!H)throw new Error('bad');
    let max=900,q=.8,out='';
    for(let n=0;n<6;n++){const k=Math.min(1,max/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
      if(out.length<300000)break;max=Math.round(max*.8);q=Math.max(.5,q-.08)}
    if(out.length>=550000)throw new Error('big');return out}
  finally{URL.revokeObjectURL(url)}
}

function zipMany(entries){ // entries: [{name, data:Uint8Array}] – unkomprimiert (stored)
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date();
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const w=(dv,o,v,n)=>n===4?dv.setUint32(o,v,true):dv.setUint16(o,v,true);
  for(const e of entries){
    const nm=enc.encode(e.name),data=e.data;let crc=0xFFFFFFFF;for(let i=0;i<data.length;i++)crc=CRC[(crc^data[i])&255]^(crc>>>8);crc=(crc^0xFFFFFFFF)>>>0;
    const L=new DataView(new ArrayBuffer(30));[[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,dt,2],[12,dd,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,nm.length,2],[28,0,2]].forEach(a=>w(L,...a));
    const C=new DataView(new ArrayBuffer(46));[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,dt,2],[14,dd,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(a=>w(C,...a));
    parts.push(L.buffer,nm,data);cen.push(C.buffer,nm);off+=30+nm.length+data.length;

  [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,entries.length,2],[10,entries.length,2],[12,csize,4],[16,off,4],[20,0,2]].forEach(a=>w(E,...a));

async function unzip(buf){ // -> Map(name -> Uint8Array); unterstützt stored + deflate
  const u=new Uint8Array(buf),dv=new DataView(u.buffer,u.byteOffset,u.byteLength);let e=-1;
  for(let i=u.length-22;i>=Math.max(0,u.length-65558);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('Keine gültige ZIP-Datei.');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=new Map(),dec=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('ZIP-Verzeichnis beschädigt.');
    const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(name.endsWith('/'))continue;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u.subarray(ds,ds+cs);

  }
  return out;
}

async function exportBackup(){
  if(S.bk&&S.bk.busy)return;
  S.bk={busy:'export',msg:'Daten werden gesammelt …'};render();

    const fl=allFiles(),entries=[],files=[],enc=new TextEncoder(),miss=[];
    for(let i=0;i<fl.length;i++){const f=fl[i];S.bk.msg=`Dateien laden ${i+1} von ${fl.length} …`;render();
      try{const b=await fileBytes(f),path=`dateien/${f.id}-${fname(f.name)||'datei'}`;entries.push({name:path,data:b});files.push({id:f.id,path,name:f.name,size:b.length,type:f.enc?'dxf':'pdf',kind:f.kind,project:f.pid})}
      catch(e){miss.push(f.name)}}
    const data={format:BKFMT,schema:BKSCHEMA,appVersion:APPV,exportedAt:new Date().toISOString(),exportedBy:S.me?.email||'',
      tasks:TASKS.map(t=>({key:t.k,label:t.l})),
      customers:Object.entries(S.rawC||{}).map(([id,d])=>({id,data:clone(d)})),

      hubs:Object.entries(S.rawH||{}).map(([id,d])=>({id,data:clone(d)})),files};
    entries.unshift({name:'daten.json',data:enc.encode(JSON.stringify(data,null,2))});
    S.bk.msg='ZIP-Datei wird erstellt …';render();

    if(ok){try{localStorage.setItem('kp-lastbk',String(Date.now()))}catch(e){}toast('Sicherung exportiert.')}
  }catch(e){S.bk={};toast('Die Sicherung konnte nicht erstellt werden.',true)}

async function readBackup(file){
  const buf=await file.arrayBuffer();let data,zip=null;
  const head=new Uint8Array(buf.slice(0,4));
  if(head[0]===0x50&&head[1]===0x4B){zip=await unzip(buf);const j=zip.get('daten.json')||[...zip.entries()].find(([n])=>n.endsWith('daten.json'))?.[1];if(!j)throw new Error('In der ZIP-Datei fehlt daten.json.');data=JSON.parse(new TextDecoder().decode(j))}
  else{try{data=JSON.parse(new TextDecoder().decode(buf))}catch(e){throw new Error('Diese Datei ist keine Sicherung dieser App (erwartet: .zip oder .json aus „Sicherung exportieren“).')}}
  if(!data||data.format!==BKFMT)throw new Error('Diese Datei ist keine Sicherung dieser App.');
  if(!Number.isInteger(data.schema)||data.schema>BKSCHEMA)throw new Error(`Die Sicherung stammt aus einer neueren App-Version (Format ${data.schema}). Bitte zuerst die App aktualisieren.`);
  const okId=id=>typeof id==='string'&&/^[A-Za-z0-9_-]{1,120}$/.test(id);
  const cs=(Array.isArray(data.customers)?data.customers:[]).filter(c=>c&&okId(c.id)&&c.data&&typeof c.data==='object');
  const ps=(Array.isArray(data.projects)?data.projects:[]).filter(p=>p&&okId(p.id)&&p.data&&typeof p.data==='object');
  const hs=(Array.isArray(data.hubs)?data.hubs:[]).filter(h=>h&&okId(h.id)&&h.data&&typeof h.data==='object');
  const files=(Array.isArray(data.files)?data.files:[]).filter(f=>f&&typeof f.id==='string'&&typeof f.path==='string');
  return {data,cs,ps,hs,files,zip};
}

async function runImport(bk,mode){
  if(!S.assets&&bk.files.length){toast('Datei-Upload ist in dieser Ansicht nicht verfügbar; Dateien werden übersprungen.',true)}
  S.bk={busy:'import',msg:'Import wird vorbereitet …'};go('sicherung');render();
  const map={},skipped=[],enc=new TextEncoder();let up=0;
  try{
    // 1. Dateien hochladen
    const need=bk.files.filter(f=>bk.zip&&bk.zip.has(f.path));
    for(let i=0;i<need.length;i++){const f=need[i];S.bk.msg=`Dateien hochladen ${i+1} von ${need.length} …`;render();
      if(!S.assets){skipped.push(f.name);continue}
      try{const bytes=bk.zip.get(f.path),isPdf=f.type!=='dxf'&&new TextDecoder().decode(bytes.subarray(0,1024)).includes('%PDF');
        const blob=new File([bytes],f.name||'datei',{type:isPdf?'application/pdf':'application/octet-stream'});
        const m=await uploadOne(blob,!isPdf);map[f.id]={...m,name:String(f.name||m.name).slice(0,200),size:bytes.length};up++}
      catch(e){skipped.push(f.name||f.id)}}
    const remap=list=>(Array.isArray(list)?list:[]).map(o=>{if(o&&o.nof===true)return clone(o);if(!o||!map[o.id])return null;const n=map[o.id];return {...clone(o),id:n.id,enc:n.enc,size:n.size}}).filter(Boolean);
    // 2. Bei "Ersetzen": aktuelle Daten löschen
    if(mode==='replace'){
      const oldFiles=allFiles();
      for(let i=0;i<S.projects.length;i++){S.bk.msg=`Aktuelle Projekte löschen ${i+1} von ${S.projects.length} …`;render();await write(()=>S.pCol.doc(S.projects[i].id).delete())}
      const hids=S.hubs.map(h=>h.id);for(let i=0;i<hids.length;i++){S.bk.msg=`Aktuelle Hubs löschen ${i+1} von ${hids.length} …`;render();await write(()=>S.hCol.doc(hids[i]).delete())}
      const cids=S.customers.map(c=>c.id);for(let i=0;i<cids.length;i++){S.bk.msg=`Aktuelle Kunden löschen ${i+1} von ${cids.length} …`;render();await write(()=>S.cCol.doc(cids[i]).delete())}
      dropAssets(oldFiles);
    }
    // 3. Kunden und Projekte schreiben
    for(let i=0;i<bk.cs.length;i++){const c=bk.cs[i];S.bk.msg=`Kunden speichern ${i+1} von ${bk.cs.length} …`;render();await write(()=>S.cCol.doc(c.id).set(clone(c.data)))}
    for(let i=0;i<bk.ps.length;i++){const p=bk.ps[i];S.bk.msg=`Projekte speichern ${i+1} von ${bk.ps.length} …`;render();
      const old=mode==='merge'?S.projects.find(x=>x.id===p.id):null;
      const d={...clone(p.data),orders:remap(p.data.orders),foamFiles:remap(p.data.foamFiles)};
      await write(()=>S.pCol.doc(p.id).set(d));
      if(old)dropAssets([...old.orders,...old.foamFiles]);
    }
    for(let i=0;i<bk.hs.length;i++){const h=bk.hs[i];S.bk.msg=`Hubs speichern ${i+1} von ${bk.hs.length} …`;render();await write(()=>S.hCol.doc(h.id).set(clone(h.data)))}
    const lost=bk.files.length-up;
    S.bk={report:`Import abgeschlossen: ${plural(bk.cs.length,'Kunde','Kunden')}, ${plural(bk.ps.length,'Projekt','Projekte')}, ${plural(bk.hs.length,'Hub','Hubs')}, ${plural(up,'Datei','Dateien')}.${lost?` ${lost} Datei(en) nicht übernommen${skipped.length?': '+esc(skipped.slice(0,5).join(', ')):''}.`:''}`};
    toast('Import abgeschlossen.');
  }catch(e){S.bk={report:'Import abgebrochen: '+esc(dbMsg(e))+' Bereits übernommene Einträge bleiben erhalten; du kannst den Import wiederholen.'};toast('Import abgebrochen.',true)}
  render();
}

const pclean=t=>String(t??'').replace(/[   \t]/g,' ').replace(/[‐‑‒]/g,'-').replace(/\r/g,'').split('').map(ch=>{const c=ch.charCodeAt(0);return ch==='\n'||(c>=32&&c<127)||(c>=160&&c<=255)||CP.includes(ch)?ch:'?'}).join('');

async function makeReport(kind,id,ex={}){
  await loadScript(PDFLIB);
  const {PDFDocument,StandardFonts,rgb}=window.PDFLib;
  const doc=await PDFDocument.create();
  const F=await doc.embedFont(StandardFonts.Helvetica),B=await doc.embedFont(StandardFonts.HelveticaBold);
  const W=595.28,H=841.89,M=44,CW=W-2*M;
  const col={ink:rgb(.067,.071,.078),ink2:rgb(.33,.35,.38),line:rgb(.85,.86,.88),red:rgb(.824,.125,.18),redd:rgb(.557,.055,.094),zebra:rgb(.965,.967,.972),head:rgb(.11,.115,.125),white:rgb(1,1,1),redt:rgb(.99,.92,.93)};
  const hex=h=>rgb(parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255);
  let page,y,title='';const pages=[],later=[];
  const now=new Date(),stamp=`${fmt(iso(now))}, ${pad(now.getHours())}:${pad(now.getMinutes())} Uhr`;
  const newPage=()=>{page=doc.addPage([W,H]);pages.push(page);
    page.drawRectangle({x:0,y:H-58,width:W,height:58,color:col.head});
    page.drawRectangle({x:0,y:H-61,width:W,height:3,color:col.red});
    page.drawText('T',{x:M,y:H-37,size:17,font:B,color:col.white});
    page.drawText("Theo's Projekte",{x:M+32,y:H-36,size:11,font:F,color:rgb(.8,.81,.84)});
    let tt=pclean(title);if(B.widthOfTextAtSize(tt,10)>CW*.55){while(tt.length>3&&B.widthOfTextAtSize(tt+'...',10)>CW*.55)tt=tt.slice(0,-1);tt+='...'}
    page.drawText(tt,{x:W-M-B.widthOfTextAtSize(tt,10),y:H-36,size:10,font:B,color:col.white});
    y=H-92};
  const room=h=>{if(y-h<M+26)newPage()};
  const wrap=(t,font,size,maxW)=>{const out=[];for(const para of pclean(t).split('\n')){let line='';for(const w of para.split(' ')){const tryL=line?line+' '+w:w;if(font.widthOfTextAtSize(tryL,size)<=maxW){line=tryL;continue}
      if(line)out.push(line);let rest=w;while(rest.length>1&&font.widthOfTextAtSize(rest,size)>maxW){let k=rest.length;while(k>1&&font.widthOfTextAtSize(rest.slice(0,k),size)>maxW)k--;out.push(rest.slice(0,k));rest=rest.slice(k)}line=rest}out.push(line)}return out};
  const text=(t,o={})=>{const size=o.size||10.5,font=o.font||F,lh=size*(o.lh||1.4),x=o.x??M,w=o.w??CW;for(const l of wrap(t,font,size,w)){room(lh);page.drawText(l,{x,y:y-size,size,font,color:o.color||col.ink});y-=lh}y-=o.gap||0};
  const h1=t=>{text(t,{size:22,font:B,lh:1.2,gap:4})};

  const kv=rows=>{const lw=130;for(const [k,v,red] of rows){const ls=wrap(v||'–',F,10.5,CW-lw);room(ls.length*15+4);page.drawText(pclean(k),{x:M,y:y-10.5,size:10,font:B,color:col.ink2});ls.forEach((l,i)=>page.drawText(l,{x:M+lw,y:y-10.5-i*15,size:10.5,font:F,color:red?col.redd:col.ink}));y-=ls.length*15+5}};
  const table=(cols,rows)=>{

    const head=()=>{room(40);page.drawRectangle({x:M,y:y-18,width:CW,height:18,color:col.head});let x=M;cols.forEach((c,i)=>{const hw=B.widthOfTextAtSize(pclean(c.h),8.5);page.drawText(pclean(c.h),{x:c.right?x+ws[i]-pd-hw:x+pd,y:y-12.5,size:8.5,font:B,color:col.white});x+=ws[i]});y-=18};

          if(l.startsWith('#P')){later.push({pg:page,x,w:ws[i],y:yy,i:+l.slice(2)});return}
          const tw2=fnt(i).widthOfTextAtSize(l,fs);page.drawText(l,{x:cols[i].right?x+ws[i]-pd-tw2:x+pd,y:yy,size:fs,font:fnt(i),color:(r.red&&r.redCol===i)?col.redd:col.ink})});x+=ws[i]});

function groupsOf(hub){const g=[];for(const s of hub.slots){const k=s.moduleInstanceId||s.number;let e=g.find(x=>x.id===k);if(!e){e={id:k,number:s.number,module:s.module,slots:[]};g.push(e)}e.slots.push(s)}return g}
const vol=c=>c.w*c.h*c.d;
function fhFits(item,rot,avail){const w=rot?item.h:item.w,h=rot?item.w:item.h;const un=c=>(c.w-w)+(c.h-h)+(c.d-item.d);
  return avail.filter(c=>w<=c.w+1e-8&&h<=c.h+1e-8&&item.d<=c.d+1e-8).sort((a,b)=>vol(a)-vol(b)||un(a)-un(b))}
const instModule=m=>{const inst=newId();return m.slots.map(s=>({id:newId(),moduleInstanceId:inst,number:s.number,type:s.type,module:s.module,position:s.position,w:s.w,h:s.h,d:s.d,customName:'',product:null}))};

function fhSearch(){
  const F=fhState(),f=F.form,k=f.unit==='cm'?10:f.unit==='in'?25.4:1;
  const item={name:f.name.trim().slice(0,80),w:parseFloat(String(f.w).replace(',','.'))*k,h:parseFloat(String(f.h).replace(',','.'))*k,d:parseFloat(String(f.d).replace(',','.'))*k};
  if(![item.w,item.h,item.d].every(n=>Number.isFinite(n)&&n>0)){F.res={t:'err',msg:'Bitte gib für Breite, Höhe und Tiefe jeweils eine Zahl größer als null ein.'};render();return}
  const direct=fhFits(item,false,FH_CELLS)[0],rot=fhFits(item,true,FH_CELLS)[0];
  if(direct&&(!rot||vol(rot)>=vol(direct)-1e-6)){F.res=null;render();fhAssign(item,false,direct);return}
  if(rot){F.pending={item,cand:rot,direct:direct||null};F.res={t:'q'};render();return}
  F.res={t:'none',msg:'Ohne Drehung passt kein Fach aus dem Katalog. Prüfe die Maße oder wähle eine andere Maßeinheit.'};render();
}

async function createHub(cid,name,btn){
  S.lastHubErr='';if(!cid){S.lastHubErr='Wähle zuerst einen Kunden aus.';return null}
  if(hubsOf(cid).some(h=>h.name.toLowerCase()===name.toLowerCase())||Object.values(fhState().localHubs).some(h=>h.customerId===cid&&h.name.toLowerCase()===name.toLowerCase())){S.lastHubErr='Diesen Hubnamen gibt es für den Kunden bereits.';return null}
  const ref=S.hCol.doc(),h={id:ref.id,customerId:cid,name:name.slice(0,80),slots:[],created:Date.now()};
  if(btn)btn.disabled=true;
  try{await write(()=>ref.set({customerId:cid,name:h.name,slots:[],createdAt:h.created}));return h}
  catch(e){S.lastHubErr='Hub konnte nicht gespeichert werden. '+dbMsg(e);return null}
  finally{if(btn&&btn.isConnected)btn.disabled=false}
}

function fhAddModuleDialog(){
  const hub=fhHub();if(!hub)return;
  openDialog(`<form id="f" novalidate>${dHead('Fachmodul hinzufügen')}<div class="db"><p class="muted" style="margin-bottom:12px">Alle einzelnen Fächer des Moduls werden im Hub „${esc(hub.name)}“ angelegt.</p>
   <div class="fld"><label for="f-mod">Modul aus dem Fachfoto</label><select class="inp" id="f-mod">${FH_CAT.map(m=>`<option value="${esc(m.number)}">${esc(m.number)} · ${esc(m.module)} · ${plural(m.slots.length,'Fach','Fächer')}</option>`).join('')}</select></div>
   <p class="muted small" id="f-modinfo"></p></div>
   <footer class="df"><button type="button" class="btn ghost" data-act="close">Abbrechen</button><button class="btn primary" type="submit">${ic('plus')}Modul hinzufügen</button></footer></form>`);
  const sel=$('#f-mod'),info=$('#f-modinfo'),show=()=>{const m=FH_CAT.find(x=>x.number===sel.value);info.textContent=m?m.slots.map(s=>`${s.position}: ${dims(s.w,s.h,s.d)}`).join(' · '):''};show();sel.onchange=show;
  $('#f').onsubmit=async e=>{e.preventDefault();const m=FH_CAT.find(x=>x.number===sel.value),cur=fhHub();if(!m||!cur)return;
    if(await saving(e.submitter,()=>queued(cur.id,()=>write(()=>S.hCol.doc(cur.id).update({slots:[...toPlain(cur.slots),...instModule(m)],updatedAt:Date.now()})))))
      {closeDialog();toast(`${m.number} mit ${plural(m.slots.length,'Fach','Fächern')} hinzugefügt.`)}};
}
function fhEditSlot(sid){
  const hub=fhHub(),s=hub&&hub.slots.find(x=>x.id===sid);if(!s)return;
  openDialog(`<form id="f" novalidate>${dHead('Fach bearbeiten')}<div class="db"><p class="muted" style="margin-bottom:12px">${esc(s.number)} · ${esc(s.position)} – Fachname und nutzbare Innenmaße anpassen (in Millimetern).</p><div class="form-err" role="alert" hidden></div>
   ${fld('cname','Fachname (optional)',s.customName,{max:80})}
   <div class="three">${fld('sw','Breite innen (mm)',String(s.w),{req:1,type:'number'})}${fld('sh','Höhe innen (mm)',String(s.h),{req:1,type:'number'})}${fld('sd','Tiefe innen (mm)',String(s.d),{req:1,type:'number'})}</div>
   ${s.product?fld('pname','Artikelname',s.product.name,{max:80}):''}</div>
   <footer class="df"><button type="button" class="btn ghost" data-act="close">Abbrechen</button><button class="btn primary" type="submit">${ic('check')}Änderungen speichern</button></footer></form>`);
  ['sw','sh','sd'].forEach(k=>{const i=$('#f-'+k);i.step='any';i.min='0';i.inputMode='decimal'});
  $('#f').onsubmit=async e=>{e.preventDefault();const v=k=>parseFloat(String($('#f-'+k).value).replace(',','.')),w=v('sw'),h=v('sh'),d=v('sd'),er={};
    [['sw',w],['sh',h],['sd',d]].forEach(([k,x])=>{if(!(Number.isFinite(x)&&x>0))er[k]='Bitte eine Zahl größer als null eingeben.'});
    if(!Object.keys(er).length&&s.product){const pw=s.product.rotated?s.product.h:s.product.w,ph=s.product.rotated?s.product.w:s.product.h;
      if(pw>w+1e-8||ph>h+1e-8||s.product.d>d+1e-8)er.sw='Das gespeicherte Produkt würde mit diesen Innenmaßen nicht mehr passen. Entferne es zuerst oder verwende größere Maße.'}
    showErrors(er);if(Object.keys(er).length)return;
    const cur=fhHub();if(!cur)return;const slots=toPlain(cur.slots),t=slots.find(x=>x.id===sid);if(!t)return;
    t.customName=$('#f-cname').value.trim().slice(0,80);t.w=w;t.h=h;t.d=d;if(t.product)t.product.name=($('#f-pname').value.trim()||'Produkt').slice(0,80);
    if(await saving(e.submitter,()=>queued(cur.id,()=>write(()=>S.hCol.doc(cur.id).update({slots,updatedAt:Date.now()})))))
      {closeDialog();fhState().res={t:'note',msg:'Fachänderungen gespeichert.'};toast('Fach gespeichert.')}};
}
function fhUnassign(sid){
  const hub=fhHub(),s=hub&&hub.slots.find(x=>x.id===sid);if(!s||!s.product)return;
  confirmDelete('Produkt entfernen',`Produkt „${esc(s.product.name)}“ aus Fach ${esc(s.number)} entfernen und das Fach freigeben?`,'Produkt entfernen',async()=>{
    const cur=fhHub(),slots=toPlain(cur.slots);const t=slots.find(x=>x.id===sid);if(t)t.product=null;
    await queued(cur.id,()=>write(()=>S.hCol.doc(cur.id).update({slots,updatedAt:Date.now()})));toast('Fach freigegeben.')});
}
function fhRemoveModule(mid){
  const hub=fhHub();if(!hub)return;const g=groupsOf(hub).find(x=>x.id===mid);if(!g)return;
  confirmDelete('Fachmodul entfernen',`Fachmodul „${esc(g.number)}“ mit ${plural(g.slots.length,'Fach','Fächern')} aus diesem Hub entfernen?`,'Modul entfernen',async()=>{
    const cur=fhHub();await queued(cur.id,()=>write(()=>S.hCol.doc(cur.id).update({slots:toPlain(cur.slots.filter(s=>(s.moduleInstanceId||s.number)!==mid)),updatedAt:Date.now()})));toast('Modul entfernt.')});
}
function fhReorder(groups){const hub=fhHub();if(!hub)return;fhWrite(hub,groups.flatMap(g=>g.slots))}
function fhMove(mid,dir){const hub=fhHub();if(!hub)return;const g=groupsOf(hub),i=g.findIndex(x=>x.id===mid),j=i+dir;if(i<0||j<0||j>=g.length)return;const [m]=g.splice(i,1);g.splice(j,0,m);fhReorder(g)}
function fhDrop(from,to,after){const hub=fhHub();if(!hub||from===to)return;const g=groupsOf(hub),i=g.findIndex(x=>x.id===from);if(i<0)return;const [m]=g.splice(i,1);const t=g.findIndex(x=>x.id===to);if(t<0)g.push(m);else g.splice(t+(after?1:0),0,m);fhReorder(g)}
document.addEventListener('dragstart',e=>{const g=e.target.closest&&e.target.closest('[data-grip]');if(!g)return;S.dragMid=g.dataset.grip;try{e.dataTransfer.setData('text/plain',S.dragMid);e.dataTransfer.effectAllowed='move'}catch(x){}g.closest('.hmod')?.classList.add('dragging')});
document.addEventListener('dragover',e=>{const m=e.target.closest&&e.target.closest('.hmod');if(!m||!S.dragMid)return;e.preventDefault();document.querySelectorAll('.hmod.drop').forEach(x=>x!==m&&x.classList.remove('drop'));if(m.dataset.mid!==S.dragMid)m.classList.add('drop')});
document.addEventListener('drop',e=>{const m=e.target.closest&&e.target.closest('.hmod');if(!m||!S.dragMid)return;e.preventDefault();const r=m.getBoundingClientRect(),from=S.dragMid;S.dragMid=null;fhDrop(from,m.dataset.mid,e.clientY>r.top+r.height/2)});
document.addEventListener('dragend',()=>{S.dragMid=null;document.querySelectorAll('.hmod').forEach(x=>x.classList.remove('drop','dragging'))});
document.addEventListener('submit',e=>{if(e.target.id==='fh-form'){e.preventDefault();fhSearch()}});


/* Aufgaben verschieben */
async function saveTaskOrder(pid,keys){
  try{await queued(pid,()=>write(()=>S.pCol.doc(pid).update({taskOrder:keys,updatedAt:Date.now()})))}catch(e){toast('Reihenfolge konnte nicht gespeichert werden. '+dbMsg(e),true)}
}
function moveTask(pid,k,to,after){
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  const keys=tasksOf(p).map(t=>t.k),i=keys.indexOf(k);if(i<0)return;keys.splice(i,1);
  let j=to==null?keys.length:keys.indexOf(to);if(j<0)j=keys.length;else if(after)j++;
  keys.splice(j,0,k);if(keys.join()===tasksOf(p).map(t=>t.k).join())return;saveTaskOrder(pid,keys);
}
function stepTask(pid,k,dir){
  const p=S.projects.find(x=>x.id===pid);if(!p)return;const keys=tasksOf(p).map(t=>t.k),i=keys.indexOf(k),j=i+dir;
  if(i<0||j<0||j>=keys.length)return;[keys[i],keys[j]]=[keys[j],keys[i]];saveTaskOrder(pid,keys);
}
document.addEventListener('dragstart',e=>{const li=e.target.closest&&e.target.closest('.task[data-tk]');if(!li||e.target.closest('.tfiles'))return;S.dragTask={pid:li.closest('.tasks').dataset.pid,k:li.dataset.tk};try{e.dataTransfer.setData('text/plain',li.dataset.tk);e.dataTransfer.effectAllowed='move'}catch(x){}li.classList.add('tdrag')});
document.addEventListener('dragover',e=>{const li=e.target.closest&&e.target.closest('.task[data-tk]');if(!li||!S.dragTask)return;e.preventDefault();document.querySelectorAll('.task.tdrop').forEach(x=>x!==li&&x.classList.remove('tdrop'));if(li.dataset.tk!==S.dragTask.k)li.classList.add('tdrop')});
document.addEventListener('drop',e=>{const li=e.target.closest&&e.target.closest('.task[data-tk]');if(!li||!S.dragTask)return;e.preventDefault();const d=S.dragTask;S.dragTask=null;if(li.dataset.tk===d.k)return;const r=li.getBoundingClientRect(),vertical=li.parentElement&&li.parentElement.children.length>0;moveTask(d.pid,d.k,li.dataset.tk,e.clientY>r.top+r.height/2)});
document.addEventListener('dragend',()=>{S.dragTask=null;document.querySelectorAll('.task').forEach(x=>x.classList.remove('tdrag','tdrop'))});
/* ---------- Toasts ---------- */
function toast(t,err=false){
  const el=document.createElement('div');el.className='toast'+(err?' err':'');el.setAttribute('role',err?'alert':'status');
  el.innerHTML=ic(err?'alert':'checkc')+'<span></span>';el.querySelector('span').textContent=t;
  const tb=$('#toasts');tb.append(el);while(tb.children.length>3)tb.firstElementChild.remove();setTimeout(()=>el.remove(),err?6000:3200);
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){const row=e.target.closest('[data-open]');if(row&&!e.target.closest('a,select,label,button'))go(row.dataset.open);return}
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'login':if(S.boot==='ready')enter();break;
    case 'forgot':forgot();break;
    case 'logout':logout();break;
    case 'nav':go(t.dataset.to);break;
    case 'close':closeDialog();break;
    case 'settings':settingsDialog();break;
    case 'mir-pick':mirPick();break;
    case 'import-folder':importChoice();break;
    case 'import-folder-go':closeDialog();importFromFolder();break;
    case 'bk-import-file':{closeDialog();const fi=$('#bfile');fi.value='';fi.click();break}
    case 'mir-now':mirrorRun(true);break;
    case 'mir-allow':mirPerm(true).then(ok=>{refreshSettings();if(ok)mirrorRun(true)});break;
    case 'mir-restore':mirRestore();break;
    case 'mir-unlink':mirUnlink();break;
    case 'new-db':newDbDialog();break;
    case 'go-backup':closeDialog();go('sicherung');break;
    case 'set':setOpt(t.dataset.k,t.dataset.v);break;
    case 'set-reset':resetSettings();break;
    case 'set-bg':bgPick(t.dataset.w);break;
    case 'home':closeDialog();go('dashboard');break;
    case 'fh-newcust':customerForm(null,{after:id=>{const F=fhState();F.cid=id;F.newCid=id;F.hid='';saveFh();render()}});break;
    case 'fh-hubs':fhHubsDialog();break;
    case 'fh-hopen':{fhState().hid=t.dataset.hid;saveFh();closeDialog();render();break}
    case 'fh-hren':fhRenameHub(t.dataset.hid);break;
    case 'fh-hdel':fhDeleteHub(t.dataset.hid);break;
    case 'fh-addmod':fhAddModuleDialog();break;
    case 'fh-mv':fhMove(t.dataset.mid,+t.dataset.dir);break;
    case 'fh-rmmod':fhRemoveModule(t.dataset.mid);break;
    case 'fh-edit':fhEditSlot(t.dataset.sid);break;
    case 'fh-unassign':fhUnassign(t.dataset.sid);break;
    case 'fh-rot-yes':{const F=fhState(),p=F.pending;if(p){F.res=null;F.pending=null;render();fhAssign(p.item,true,p.cand)}break}
    case 'fh-rot-no':{const F=fhState(),p=F.pending;F.pending=null;if(p&&p.direct){F.res=null;render();fhAssign(p.item,false,p.direct)}else{F.res={t:'none',msg:'Dann passt der Artikel in kein Fach. Prüfe die Maße oder die Ausrichtung.'};render()}break}
    case 'new-customer':customerForm(null);break;
    case 'new-project':projectForm(null,t.dataset.cid);break;
    case 'edit-customer':{const c=cust(id);if(c)customerForm(c);break}
    case 'del-customer':{const c=cust(id);if(c)deleteCustomer(c);break}
    case 'edit-project':{const p=S.projects.find(x=>x.id===id);if(p)projectForm(p);break}
    case 'del-project':{const p=S.projects.find(x=>x.id===id);if(p)confirmDelete('Projekt löschen',`Projekt „${esc(p.name)}“ wirklich löschen?${p.orders.length+p.foamFiles.length?` Angehängte Dateien (${p.orders.length+p.foamFiles.length}) werden ebenfalls gelöscht.`:''}`,'Projekt löschen',async()=>{await write(()=>S.pCol.doc(p.id).delete());dropAssets([...p.orders,...p.foamFiles]);toast('Projekt gelöscht.');if(route().v==='project')go('projekte')});break}
    case 'chart-sel':{const k=t.dataset.k,lg=t.classList.contains('lg'),kb=t===document.activeElement;S.chartSel=S.chartSel===k?null:k;render();if(kb){const n=document.querySelector(`${lg?'.lg':'svg *'}[data-act="chart-sel"][data-k="${k}"]`);if(n)n.focus({preventScroll:true})}break}
    case 'chart-open':Object.assign(S.pf,{q:'',customer:'',status:t.dataset.k,due:'',phase:''});go('projekte');break;
    case 'kpi':{const f=t.dataset.f;if(t.dataset.to==='projekte'){Object.assign(S.pf,{q:'',customer:'',status:'',due:'',phase:''});if(STM[f])S.pf.status=f;if(f==='overdue'||f==='upcoming'){S.pf.due=f;S.pf.sort='due';S.pf.dir='asc'}}go(t.dataset.to);break}
    case 'cmode':S.cf.mode=t.dataset.m;render();break;
    case 'creset':S.cf={q:'',mode:'all'};render();break;
    case 'preset':Object.assign(S.pf,{q:'',customer:'',status:'',due:'',phase:''});render();break;
    case 'task-toggle':{const p=S.projects.find(x=>x.id===id);if(p)setTask(id,t.dataset.k,p.tasks[t.dataset.k]?'':S.today);break}
    case 'dev-add':deviceForm(id);break;
    case 'dev-edit':deviceForm(id,t.dataset.did);break;
    case 'dev-del':deleteDevice(id,t.dataset.did);break;
    case 'phase-sel':{const k=t.dataset.k,lg=t.classList.contains('lg'),kb=t===document.activeElement;S.phaseSel=S.phaseSel===k?null:k;render();if(kb){const n=document.querySelector(`${lg?'.lg':'svg *'}[data-act="phase-sel"][data-k="${k}"]`);if(n)n.focus({preventScroll:true})}break}
    case 'done-sel':{const k=t.dataset.k,lg=t.classList.contains('lg'),kb=t===document.activeElement;S.doneSel=S.doneSel===k?null:k;render();if(kb){const n=document.querySelector(`${lg?'.lg':'svg *'}[data-act="done-sel"][data-k="${k}"]`);if(n)n.focus({preventScroll:true})}break}
    case 'gp-sel':{const k=t.dataset.k,kb=t===document.activeElement,cls=t.className.baseVal!==undefined?'svg':t.classList.contains('glr')?'.glr':'.sg';S.gpSel=S.gpSel===k?null:k;render();if(kb){const n=document.querySelector(`${cls==='svg'?'svg *':cls}[data-act="gp-sel"][data-k="${k}"]`);if(n)n.focus({preventScroll:true})}break}
    case 'dq-all':Object.assign(S.pf,{q:S.dq.trim(),customer:'',status:'',due:'',phase:''});go('projekte');break;
    case 'bk-export':exportBackup();break;
    case 'bk-now':go('sicherung');exportBackup();break;
    case 'bk-import':{const fi=$('#bfile');fi.value='';fi.click();break}
    case 'done-dlg':doneDialog();break;
    case 'done-exp':exportDone(t.dataset.m,t);break;
    case 'cust-open':{const k=t.dataset.c;COPEN.has(k)?COPEN.delete(k):COPEN.add(k);render();break}
    case 'cust-st':{Object.assign(S.pf,{q:'',customer:t.dataset.c,status:t.dataset.s,due:'',phase:''});go('projekte');break}
    case 'dsort':S.dsort=t.dataset.v;render();break;
    case 'dsec':{const k=t.dataset.k;S.dsec[k]=S.dsec[k]?0:1;try{localStorage.setItem('kp-dsec',JSON.stringify(S.dsec))}catch(e){}render();break}
    case 'pmore':S.pshow+=30;render();break;
    case 'phase-open':Object.assign(S.pf,{q:'',customer:'',status:'',due:'',phase:t.dataset.k});go('projekte');break;
    case 'export':exportPdf(t.dataset.kind,id,t);break;
    case 'order-add':orderForm(id);break;
    case 'order-edit':orderForm(id,t.dataset.oid);break;
    case 'foam-add':{const fi=$('#ffile');fi.dataset.pid=id;fi.value='';fi.click();break}
    case 'task-mv':stepTask(id,t.dataset.k,+t.dataset.dir);break;
    case 'file-view':viewFile(id,t.dataset.kind,t.dataset.oid);break;
    case 'file-dl':downloadFile(id,t.dataset.kind,t.dataset.oid,t);break;
    case 'file-del':deleteFile(id,t.dataset.kind,t.dataset.oid);break;
    case 'task-date':taskDialog(id,t.dataset.k);break;
    case 'task-add':addExtraDialog(id);break;
    case 'proj-img':imageDialog(id);break;
    case 'pause-toggle':togglePause(id,t);break;
    case 'sortdir':S.pf.dir=S.pf.dir==='asc'?'desc':'asc';render();break;
  }
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.id==='dq'&&S.dq.trim()){e.preventDefault();const h=S.projects.filter(p=>projMatch(p,S.dq.trim()));if(h.length===1)go('projekt-'+h[0].id);else{Object.assign(S.pf,{q:S.dq.trim(),customer:'',status:'',due:'',phase:''});go('projekte')}return}
  if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('svg [data-act]')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
document.addEventListener('input',e=>{
  if(e.target.id==='cq'){S.cf.q=e.target.value;render()}
  else if(e.target.id==='dq'){S.dq=e.target.value;render()}
  else if(e.target.id==='dpq'){S.pq=e.target.value;S.pshow=30;render()}
  else if(e.target.id==='dpph'){S.pph=e.target.value;S.pshow=30;render()}
  else if(e.target.id==='pq'){S.pf.q=e.target.value;render()}
  else if(e.target.dataset.fhf&&e.target.dataset.fhf!=='unit'){fhState().form[e.target.dataset.fhf]=e.target.value;if(S.fh.res){S.fh.res=null;S.fh.pending=null;const r=$('#fh-res');if(r){r.innerHTML='';r.style.marginTop='0'}}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pf){S.pf[t.dataset.pf]=t.value;render()}
  else if(t.dataset.fh==='cid'){const F=fhState();F.cid=t.value;F.hid='';F.res=null;saveFh();const hs=hubsOf(t.value);if(hs.length===1)F.hid=hs[0].id;saveFh();render()}
  else if(t.dataset.fh==='hid'){const F=fhState();F.hid=t.value;F.res=null;saveFh();render()}
  else if(t.dataset.fhf==='unit'){fhState().form.unit=t.value;saveFh()}
  else if(t.dataset.taskDate)setTask(t.dataset.taskDate,t.dataset.k,t.value);
  else if(t.id==='bfile'&&t.files.length){const f=t.files[0];readBackup(f).then(bk=>importDialog(bk,f.name),err=>toast(err&&err.message?err.message:'Die Datei konnte nicht gelesen werden.',true))}
  else if(t.id==='ffile'&&t.files.length)addFoamFiles(t.dataset.pid,[...t.files]);
});
/* Datumswechsel um Mitternacht: Überfälligkeit nach lokaler Zeitzone neu berechnen */
setInterval(()=>{const t=todayISO();if(t!==S.today){S.today=t;if(S.authed)render()}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=todayISO();if(t!==S.today){S.today=t;if(S.authed)render()}}});
}
</script>
